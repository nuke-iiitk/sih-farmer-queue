# Render.com blueprint — National Farmer Procurement Portal
# Deploy: Render Dashboard → New + → Blueprint → connect this repo.
# Creates: 1 managed PostgreSQL database + FastAPI API service + static site.
#
# Notes:
# • The free Postgres plan (basic-256mb) expires after 30 days — upgrade the
#   database in the Render dashboard to keep data long-term.
# • The static site bakes EXPO_PUBLIC_API_URL into the JS at build time. If the
#   API service URL differs from the default below, edit it and re-deploy the
#   static site.

databases:
  - name: kisan-kraya-db
    databaseName: kisan_procurement
    user: kisan_app
    plan: basic-256mb # free tier

services:
  # ---------------------------------------------------------------- API (FastAPI)
  - type: web
    name: kisan-kraya-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.services.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kisan-kraya-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true # strong random key per blueprint sync
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://kisan-kraya-web.onrender.com,http://localhost:8081,http://localhost:19006
      - key: REQUIRE_OFFICER_AUTH
        value: "false" # demo mode — flip to true to protect queue mutations
      - key: MINUTES_PER_FARMER
        value: "7"
      - key: DEMO_OTP
        value: "123456"

  # ------------------------------------------------------- Frontend (Expo static)
  - type: web
    name: kisan-kraya-web
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EXPO_PUBLIC_API_URL
        value: https://kisan-kraya-api.onrender.com
      - key: EXPO_PUBLIC_USE_BACKEND
        value: "true"
    # Expo static export emits one HTML file per route, so deep links resolve
    # natively; nothing to rewrite.<tool_call>editor<arg_key>new_text</arg_key><arg_value>      - key: EXPO_PUBLIC_USE_BACKEND
        value: "true"
    # Expo static export emits one HTML file per route, so deep links resolve
    # natively; nothing to rewrite.